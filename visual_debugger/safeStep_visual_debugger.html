
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SafeStep Side View</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <h2>SafeStep Obstacle Visualizer (Side View)</h2>
  <label>Enter ESP32 IP:
    <input type="text" id="ipInput" placeholder="192.168.x.x" />
  </label>
  <button onclick="connectESP()">Connect</button>
  <p>Status: <span id="status">🟡 Not Connected</span></p>
  <div id="graph" style="height: 500px;"></div>
  <p><small>X = forward distance from user (mm), Y = height from floor (mm)</small></p>

  <script>
    let connected = false;
    const colors = ['red', 'green', 'blue', 'orange'];

    function connectESP() {
      const ip = document.getElementById("ipInput").value;
      if (!ip) return alert("Please enter an IP!");

      const script = document.createElement("script");
      script.src = `http://${ip}/webserial.js`;
      script.onload = () => {
        connected = true;
        document.getElementById("status").textContent = "🟢 Connected";

        WebSerial.onMessage = function (_, message) {
          try {
            const sensors = JSON.parse(message);
            if (!Array.isArray(sensors)) return;

            const traces = sensors.map((sensor, index) => ({
              x: sensor.points.map(p => p.x),
              y: sensor.points.map(p => p.y),
              mode: 'markers',
              type: 'scatter',
              name: `Sensor ${index + 1}`,
              marker: { color: colors[index % colors.length] }
            }));

            Plotly.react("graph", traces, {
              xaxis: { title: "Forward Distance (mm)", range: [0, 1000] },
              yaxis: { title: "Height from Floor (mm)", range: [0, 1800] },
              title: "Side View of Detected Obstacles",
              showlegend: true
            });
          } catch (e) {
            console.warn("Skipped non-graph message:", message);
          }
        };
      };
      script.onerror = () => {
        document.getElementById("status").textContent = "🔴 Failed to load /webserial.js";
      };
      document.body.appendChild(script);
    }

    Plotly.newPlot("graph", [{
      x: [],
      y: [],
      mode: 'markers',
      type: 'scatter'
    }], {
      xaxis: { title: "Forward Distance (mm)", range: [0, 1000] },
      yaxis: { title: "Height from Floor (mm)", range: [0, 1800] },
      title: "Side View of Detected Obstacles"
    });
  </script>
</body>
</html>
